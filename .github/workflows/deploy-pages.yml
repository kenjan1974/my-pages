name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy content to temp dir (exclude .git and .github)
          rsync -av --exclude='.git' --exclude='.github' . /tmp/site/

          # Create or reset gh-pages branch
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Replace all content
          git rm -rf . --quiet 2>/dev/null || true
          rsync -av /tmp/site/ .
          touch .nojekyll

          git add -A
          git diff --cached --quiet || git commit -m "deploy: 從 main 部署 (${GITHUB_SHA::7})"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
